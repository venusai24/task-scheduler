version: '3.8'

services:
  nats:
    image: nats:latest
    container_name: astra-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-js"
    networks:
      - astra-net

  # --- SCHEDULER CLUSTER (Raft) ---
  node-1:
    build: .
    image: astra-core:latest
    container_name: astra-node-1
    command: scheduler --id node-1 --port :50051 --raft node-1:6000 --bootstrap=true
    environment:
      - SCHED_CERT_FILE=/app/certs/server.crt
      - SCHED_KEY_FILE=/app/certs/server.key
      - SCHED_CA_FILE=/app/certs/ca.crt
      - ASTRA_AUTH_TOKEN=my-secret-key
      - NATS_TOKEN=
      - NATS_URL=nats://nats:4222
      - EXECUTION_STRATEGY=${EXECUTION_STRATEGY:-NATS} # Control NATS vs DOCKER
    volumes:
      - ./certs:/app/certs
      - ./data/node-1:/app/data/node-1
      # Docker Socket mount for Dynamic Mode (DOCKER_IN_DOCKER pattern)
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "50051:50051"
      - "6000:6000"
    depends_on:
      - nats
    networks:
      - astra-net

  node-2:
    image: astra-core:latest
    container_name: astra-node-2
    command: scheduler --id node-2 --port :50052 --raft node-2:6000 --join node-1:50051
    environment:
      - SCHED_CERT_FILE=/app/certs/server.crt
      - SCHED_KEY_FILE=/app/certs/server.key
      - SCHED_CA_FILE=/app/certs/ca.crt
      - ASTRA_AUTH_TOKEN=my-secret-key
      - NATS_URL=nats://nats:4222
      - EXECUTION_STRATEGY=${EXECUTION_STRATEGY:-NATS}
    volumes:
      - ./certs:/app/certs
      - ./data/node-2:/app/data/node-2
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "50052:50052"
    depends_on:
      - node-1
    networks:
      - astra-net

  node-3:
    image: astra-core:latest
    container_name: astra-node-3
    command: scheduler --id node-3 --port :50053 --raft node-3:6000 --join node-1:50051
    environment:
      - SCHED_CERT_FILE=/app/certs/server.crt
      - SCHED_KEY_FILE=/app/certs/server.key
      - SCHED_CA_FILE=/app/certs/ca.crt
      - ASTRA_AUTH_TOKEN=my-secret-key
      - NATS_URL=nats://nats:4222
      - EXECUTION_STRATEGY=${EXECUTION_STRATEGY:-NATS}
    volumes:
      - ./certs:/app/certs
      - ./data/node-3:/app/data/node-3
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "50053:50053"
    depends_on:
      - node-1
    networks:
      - astra-net

  # --- STATIC WORKER (Standard Celery Mode) ---
  worker-static:
    image: astra-core:latest
    container_name: astra-worker-static
    command: worker
    # Only start this if we are in NATS mode.
    # We can't conditionally start services in pure compose without profiles.
    # For now, we let it run, it will just listen.
    profiles: [ "static" ] # Only start via --profile static
    environment:
      - WORKER_CERT_FILE=/app/certs/worker.crt
      - WORKER_KEY_FILE=/app/certs/worker.key
      - SCHED_CA_FILE=/app/certs/ca.crt
      - ASTRA_AUTH_TOKEN=my-secret-key
      - NATS_URL=nats://nats:4222
      # The static worker connects to load-balanced scheduler gRPC
      # In docker, we can point to specific node or use internal DNS if we had a LB
      - ASTRA_SCHED_ADDRS=node-1:50051,node-2:50052,node-3:50053
    volumes:
      - ./certs:/app/certs
    depends_on:
      - node-1
    networks:
      - astra-net

  # --- AGENT (Reasoning) ---
  agent:
    build:
      context: ./reasoning
      dockerfile: Dockerfile.agent
    container_name: astra-agent
    environment:
      - NATS_URL=nats://nats:4222
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - nats
    networks:
      - astra-net

networks:
  astra-net:
    driver: bridge
